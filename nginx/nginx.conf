user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles_cache:10m max_size=1g inactive=24h use_temp_path=off;

    server {
        listen 80;
        server_name _;

        client_max_body_size 100M;

        location /static/ {
            alias /app/media_static/;
        }

        location /media/ {
            alias /app/media/;
        }

        location ~ ^/api/v1/map/tiles/(\d+)/(\d+)/(\d+)\.png$ {
            proxy_pass http://172.20.20.2/map/main/$1/$2/$3.png;
            proxy_set_header Host tosh.safecity.uz;
            proxy_set_header Referer http://tosh.safecity.uz/;
            proxy_connect_timeout 10s;
            proxy_read_timeout 15s;
            proxy_cache tiles_cache;
            proxy_cache_valid 200 24h;
            proxy_cache_key "$uri";
            add_header X-Cache-Status $upstream_cache_status;
        }

        location / {
            proxy_pass http://mahalla_account_web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}