# Frontend (https://192.168.168.149:3000) nginx server bloki ichiga include qilinadi.
#
# Maqsad: REST va WebSocket ni frontend'ning O'Z HTTPS origin'i orqali o'tkazish.
# Shu bilan:
#   - wss://192.168.168.149:3000/ws/damafon/  ishlaydi (sertifikat allaqachon qabul qilingan),
#   - mixed content (https sahifa -> http API) yo'qoladi,
#   - CORS preflight ham kerak bo'lmaydi (same-origin).
#
# Bu fayl 149 serverida frontend nginx'ining HTTPS `server` bloki ichida
# turishi kerak (konteyner ichida u `listen 443 ssl`, chunki docker 3000 -> 443):
#
#     server {
#         listen 443 ssl;
#         ...
#         include /etc/nginx/snippets/frontend-3000-proxy.conf;
#         location / { try_files $uri /index.html; }   # SPA fallback — o'zgarmaydi
#     }
#
# DIQQAT: bu faylni `/etc/nginx/conf.d/` ga QO'YMANG. nginx.conf da
# `include /etc/nginx/conf.d/*.conf;` bor — fayl `http` darajasida ham
# yuklanib ketadi va `location` u yerda taqiqlanganligi uchun nginx
# "location directive is not allowed here" deb ko'tarilmaydi.
# Shuning uchun `/etc/nginx/snippets/` ishlatiladi.
#
# Frontend build env ham yangilanishi shart:
#     REACT_APP_API_URL=https://192.168.168.149:3000/api/v1
#
# DIQQAT: `location /static/` ni bu yerga QO'SHMANG — u React build'ning
# o'z /static/js/main.*.js fayllari uchun band.

# Backend nginx manzili (docker-compose: "8080:80").
# Host IP ishlatilgan: frontend nginx konteynerda bo'lsa ham, hostda bo'lsa ham ishlaydi.
# proxy_pass da ATAYLAB o'zgaruvchi ishlatilmadi — o'zgaruvchi bo'lsa nginx URI ni
# boshqacha uzatadi va resolver talab qilishi mumkin.

# ---------------------------------------------------------------- REST API
location /api/v1/ {
    proxy_pass http://192.168.168.149:8080;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 100M;
    proxy_connect_timeout 10s;
    proxy_read_timeout    120s;
}

# ------------------------------------------------------- WebSocket (barchasi)
# /ws/damafon/, /ws/damafon/talkback/, /ws/alerts/, /ws/gps-url/ — hammasi
# 8080 dagi nginx orqali kerakli upstream'ga boradi.
location /ws/ {
    proxy_pass http://192.168.168.149:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# --------------------------------------------------- go2rtc (kamera WebRTC/MSE)
# Frontend go2rtc URL ini ham El() helper orqali qayta yasaydi, ya'ni u ham
# wss://<origin>/go2rtc/... ga aylanadi. REST (/go2rtc/api/...) va WS bir joyda.
location /go2rtc/ {
    proxy_pass http://192.168.168.149:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ------------------------------------------------------------- Media / assets
# Rebuild'dan keyin frontend media URL larini ham o'z origin'iga o'giradi
# (Dl() helper), shuning uchun bu ikkitasi ham kerak.
location /media/ {
    proxy_pass http://192.168.168.149:8080;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto https;
}

location /assets/ {
    proxy_pass http://192.168.168.149:8080;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto https;
}
